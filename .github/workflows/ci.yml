name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: E2E tests
        run: bash util/tests/test.sh
        env:
          SEKIEN_BIN: ./target/release/sekien

  other-platforms:
    # Lints, unit-tests and end-to-end tests the macOS/Windows code paths
    # (cfg(not(target_os = "linux"))) and their OS WebViews (WKWebView,
    # WebView2) on every push, instead of first building them when a release
    # is tagged. The hosted runners have a desktop session, so the WebView can
    # render. They run recent OS versions, so this does not check the minimum
    # WebView versions in the README.
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: E2E tests
        # Windows: WebView2 creation fails on this runner, including for
        # v0.4.2 (#5). Keep running it so the status stays visible, but don't
        # fail the job until that is resolved.
        continue-on-error: ${{ runner.os == 'Windows' }}
        shell: bash
        run: bash util/tests/test.sh
        env:
          SEKIEN_BIN: ./target/release/sekien${{ runner.os == 'Windows' && '.exe' || '' }}

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb

      - name: Build
        run: cargo build --locked

      - name: Unit tests
        run: cargo test --locked

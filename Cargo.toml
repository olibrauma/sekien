[package]
name = "sekien"
version = "0.1.0"
edition = "2021"
description = "sekien — converts Mermaid diagrams to SVG"
license = "MIT OR Apache-2.0"

[[bin]]
name = "sekien"
path = "src/main.rs"

[dependencies]
wry = "0.55"
tao = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

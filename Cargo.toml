[package]
name = "sekien"
version = "0.5.1"
# Edition 2024 is blocked on src/linux_display.rs setting environment variables
# (see the "Known issue" section there).
edition = "2021"
# 1.88: wry 0.57 and tao 0.37 need 1.85, and transitive dependencies (icu,
# time) need 1.88. 1.85 also fails in practice: yoke-derive 0.8.3 uses a 1.87
# API without declaring rust-version, so MSRV-aware resolution still picks it.
# CI builds and tests with 1.88 (the msrv job).
rust-version = "1.88"
description = "Mermaid-to-SVG renderer using OS-native WebView — CLI and Rust library (render_stream)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/olibrauma/sekien"
homepage = "https://github.com/olibrauma/sekien"
readme = "README.md"
keywords = ["mermaid", "svg", "cli", "streaming", "webview"]
categories = ["command-line-utilities", "visualization"]

[lib]
name = "sekien"
path = "src/lib.rs"

[[bin]]
name = "sekien"
path = "src/main.rs"

[dependencies]
wry = "0.57"
# tao's default `dbus` feature only reads and watches the desktop's light/dark
# preference over the session bus, which never affects the output. `rwh_06` is
# needed for `build(&window)`; `x11` for the Linux display setup (see
# src/linux_display.rs).
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[build-dependencies]
sha2 = "0.10"

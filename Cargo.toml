[package]
name = "sekien"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "A lightweight Mermaid-to-SVG renderer using OS native WebView. Supports NUL-delimited streaming protocol for high performance."
license = "MIT OR Apache-2.0"
repository = "https://github.com/olibrauma/sekien"
homepage = "https://github.com/olibrauma/sekien"
readme = "README.md"
keywords = ["mermaid", "svg", "cli", "streaming", "webview"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "sekien"
path = "src/main.rs"

[dependencies]
wry = "0.55"
tao = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
sha2 = "0.10"
